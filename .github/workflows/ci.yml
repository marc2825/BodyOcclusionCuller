name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unit tests (no Blender)
        run: python scripts/extension/run_tests.py --python-only

      - name: Set up Blender
        id: blender
        uses: ./.github/actions/setup-blender

      - name: Blender integration tests
        env:
          BLENDER: ${{ steps.blender.outputs.blender }}
        run: >-
          "$BLENDER" --background --factory-startup --offline-mode --python-exit-code 1
          --python tests/extension/blender_integration.py

      - name: Build and validate the Extension ZIP
        run: python scripts/extension/package_extension.py --blender "${{ steps.blender.outputs.blender }}"

      - name: Install the ZIP into an isolated repository
        env:
          BLENDER: ${{ steps.blender.outputs.blender }}
        run: >-
          "$BLENDER" -b --factory-startup --offline-mode --python-exit-code 1
          --python tests/extension/install_zip.py

      - name: Upload the Extension ZIP
        uses: actions/upload-artifact@v7
        with:
          name: underwhere-extension
          path: |
            dist/*.zip
            dist/*.zip.sha256
          retention-days: 14

      - name: Upload test outputs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-outputs
          path: outputs/underwhere/*.json
          retention-days: 7
